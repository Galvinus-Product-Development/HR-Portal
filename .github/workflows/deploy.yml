name: Deploy to ECS

on:
  push:
    paths:
      - "Backend-UM/**"  # Only track changes in Backend-UM
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}
      EXECUTION_ROLE_ARN: arn:aws:iam::<account-id>:role/ecsTaskExecutionRole
      TASK_ROLE_ARN: arn:aws:iam::<account-id>:role/ecsTaskRole
      SUBNETS: subnet-abc123,subnet-def456
      SECURITY_GROUPS: sg-abc123

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Determine Changed Services
        id: changed
        uses: dorny/paths-filter@v2
        with:
          filters: |
            Backend-UM: Backend-UM/**  # Only track changes in Backend-UM

      - name: Deploy hr-app
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');  // Destructure to avoid redeclaration

            // Ports mapping for the service
            const ports = {
              "hr-app": 5000  // Adjusted port for hr-app service
            };

            const serviceName = "hr-app-service";  // Service name updated
            const repo = "hr-app";  // Repo name updated

            const ECR_REGISTRY = process.env.ECR_REGISTRY || '${{ steps.login-ecr.outputs.registry }}';
            const IMAGE_TAG = process.env.IMAGE_TAG || '${{ github.sha }}';

            if (process.env.changed_Backend_UM === 'true') {
              const taskDefJson = `taskdef-${repo}.json`;
              const fullImage = `${ECR_REGISTRY}/${repo}:${IMAGE_TAG}`;

              console.log(`\u001b[1mDeploying ${repo}\u001b[0m`);

              execSync(`aws ecr describe-repositories --repository-names ${repo} || aws ecr create-repository --repository-name ${repo}`);
              execSync(`docker build -t ${fullImage} -f Backend-UM/Dockerfile Backend-UM`);
              execSync(`docker push ${fullImage}`);

              const taskDef = {
                family: "hr-app-service",  // Task definition name updated
                networkMode: "awsvpc",
                requiresCompatibilities: ["EC2"],
                cpu: "256",
                memory: "512",
                executionRoleArn: process.env.EXECUTION_ROLE_ARN,
                taskRoleArn: process.env.TASK_ROLE_ARN,
                containerDefinitions: [
                  {
                    name: repo,
                    image: fullImage,
                    essential: true,
                    portMappings: [
                      {
                        containerPort: ports[repo],
                        protocol: "tcp"
                      }
                    ]
                  }
                ]
              };

              fs.writeFileSync(taskDefJson, JSON.stringify(taskDef, null, 2));
              execSync(`aws ecs register-task-definition --cli-input-json file://${taskDefJson}`);
              execSync(`aws ecs update-service --cluster ${process.env.CLUSTER_NAME} --service ${serviceName} --force-new-deployment`);
            }
        env:
          changed_Backend_UM: ${{ steps.changed.outputs.Backend-UM }}
