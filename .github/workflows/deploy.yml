name: Deploy Frontend to ECS

on:
  push:
    paths:
      - "Frontend/**"   # Only trigger when Frontend/ changes
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: hr-ecs-cluster
      SERVICE_NAME: hr-app-service  
      SUBNETS: subnet-abc123,subnet-def456
      SECURITY_GROUPS: sg-abc123

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Determine Changed Services
        id: changed
        uses: dorny/paths-filter@v2
        with:
          filters: |
            Frontend: Frontend/**

      - name: Deploy Frontend
        if: steps.changed.outputs.Frontend == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            const repo = "frontend-app"; // name of your ECR repo (could be 'frontend-app' or anything you use)
            const serviceName = process.env.SERVICE_NAME;
            const clusterName = process.env.CLUSTER_NAME;
            const ECR_REGISTRY = '${{ steps.login-ecr.outputs.registry }}';
            const IMAGE_TAG = '${{ github.sha }}';
            const fullImage = `${ECR_REGISTRY}/${repo}:${IMAGE_TAG}`;

            console.log(`🚀 Deploying Frontend: ${repo}`);

            // Make sure ECR repo exists
            execSync(`aws ecr describe-repositories --repository-names ${repo} || aws ecr create-repository --repository-name ${repo}`, { stdio: 'inherit' });

            // Build and push Docker image
            console.log(`🔨 Building Docker image from Frontend/`);
            execSync(`docker build -t ${fullImage} -f Frontend/Dockerfile Frontend`, { stdio: 'inherit' });
            execSync(`docker push ${fullImage}`, { stdio: 'inherit' });

            // Get current task definition
            console.log(`📄 Fetching current task definition for ${serviceName}`);
            const currentTaskDefArn = execSync(`aws ecs describe-services --cluster ${clusterName} --services ${serviceName} --query "services[0].taskDefinition" --output text`).toString().trim();
            const currentTaskDef = JSON.parse(execSync(`aws ecs describe-task-definition --task-definition ${currentTaskDefArn} --query "taskDefinition"`).toString());

            // Update image
            currentTaskDef.containerDefinitions.forEach(container => {
              container.image = fullImage;
            });

            // Cleanup unnecessary fields before re-register
            delete currentTaskDef.taskDefinitionArn;
            delete currentTaskDef.revision;
            delete currentTaskDef.status;
            delete currentTaskDef.requiresAttributes;
            delete currentTaskDef.registeredAt;
            delete currentTaskDef.registeredBy;
            delete currentTaskDef.compatibilities;

            // Write new taskdef
            fs.writeFileSync('new-taskdef.json', JSON.stringify(currentTaskDef, null, 2));

            console.log('📦 Registering new task definition...');
            const registerCmd = `aws ecs register-task-definition --cli-input-json file://new-taskdef.json`;
            const registerResult = JSON.parse(execSync(registerCmd).toString());
            const newTaskDefArn = registerResult.taskDefinition.taskDefinitionArn;

            console.log(`✅ New Task Definition: ${newTaskDefArn}`);

            // Update ECS Service
            console.log('🔄 Updating ECS service with new task definition...');
            execSync(`aws ecs update-service --cluster ${clusterName} --service ${serviceName} --task-definition ${newTaskDefArn} --force-new-deployment`, { stdio: 'inherit' });

            console.log('🎉 Frontend Deployment Completed!');
        env:
          changed_Frontend: ${{ steps.changed.outputs.Frontend }}
