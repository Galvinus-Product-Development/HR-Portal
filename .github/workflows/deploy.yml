name: Deploy to ECS

on:
  push:
    paths:
      - "Backend-UM/**"  # Only track changes in Backend-UM
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: hr-ecs-cluster
      SERVICE_NAME: hr-app-service  # Moved service name here for clarity
      SUBNETS: subnet-abc123,subnet-def456
      SECURITY_GROUPS: sg-abc123

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Determine Changed Services
        id: changed
        uses: dorny/paths-filter@v2
        with:
          filters: |
            Backend-UM: Backend-UM/**

      - name: Deploy hr-app
        if: steps.changed.outputs.Backend-UM == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            const repo = "hr-app";
            const serviceName = process.env.SERVICE_NAME;
            const clusterName = process.env.CLUSTER_NAME;
            const ECR_REGISTRY = '${{ steps.login-ecr.outputs.registry }}';
            const IMAGE_TAG = '${{ github.sha }}';
            const fullImage = `${ECR_REGISTRY}/${repo}:${IMAGE_TAG}`;

            console.log(`\u001b[1mDeploying ${repo}\u001b[0m`);

            // Make sure ECR repo exists
            execSync(`aws ecr describe-repositories --repository-names ${repo} || aws ecr create-repository --repository-name ${repo}`);

            // Build and push Docker image
            execSync(`docker build -t ${fullImage} -f Backend-UM/Dockerfile Backend-UM`);
            execSync(`docker push ${fullImage}`);

            // Update ECS Service with new image
            const describeTaskDefCmd = `aws ecs describe-services --cluster ${clusterName} --services ${serviceName} --query "services[0].taskDefinition" --output text`;
            const currentTaskDefinition = execSync(describeTaskDefCmd).toString().trim();

            console.log(`Current task definition: ${currentTaskDefinition}`);

            // Create a new task definition revision by updating only the container image
            const newTaskDef = execSync(`aws ecs describe-task-definition --task-definition ${currentTaskDefinition}`);
            const taskDefObj = JSON.parse(newTaskDef.toString());

            // Modify the container image
            taskDefObj.taskDefinition.containerDefinitions.forEach(container => {
              if (container.name === repo) {
                container.image = fullImage;
              }
            });

            // Register new task definition revision
            const registerPayload = {
              family: taskDefObj.taskDefinition.family,
              taskRoleArn: taskDefObj.taskDefinition.taskRoleArn,
              executionRoleArn: taskDefObj.taskDefinition.executionRoleArn,
              networkMode: taskDefObj.taskDefinition.networkMode,
              containerDefinitions: taskDefObj.taskDefinition.containerDefinitions,
              requiresCompatibilities: taskDefObj.taskDefinition.requiresCompatibilities,
              cpu: taskDefObj.taskDefinition.cpu,
              memory: taskDefObj.taskDefinition.memory,
              volumes: taskDefObj.taskDefinition.volumes,
            };

            const fs = require('fs');
            fs.writeFileSync('new-taskdef.json', JSON.stringify(registerPayload, null, 2));

            console.log('Registering updated task definition...');
            const registerCmd = `aws ecs register-task-definition --cli-input-json file://new-taskdef.json`;
            const registerResult = execSync(registerCmd).toString();
            const newTaskDefinitionArn = JSON.parse(registerResult).taskDefinition.taskDefinitionArn;

            console.log(`New Task Definition: ${newTaskDefinitionArn}`);

            // Update ECS Service to use the new task definition
            execSync(`aws ecs update-service --cluster ${clusterName} --service ${serviceName} --task-definition ${newTaskDefinitionArn} --force-new-deployment`);
        env:
          changed_Backend_UM: ${{ steps.changed.outputs.Backend-UM }}
